<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OML Team Selection Lottery</title>
<style>
:root{
  --navy:#020714; --navy2:#07162e; --blue:#28a8ff; --blue2:#6cc7ff;
  --gold:#ffd15a; --gold2:#b88518; --silver:#edf6ff; --muted:#9db5d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;color:var(--silver);background:#010611;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-5;background:
 radial-gradient(circle at 50% -10%, rgba(43,158,255,.5), transparent 26%),
 radial-gradient(circle at 15% 20%, rgba(17,96,189,.45), transparent 28%),
 radial-gradient(circle at 85% 20%, rgba(17,96,189,.45), transparent 28%),
 linear-gradient(180deg,#020611 0%,#06152b 40%,#020611 100%);}
body:after{content:"";position:fixed;inset:0;z-index:-4;background:
 linear-gradient(115deg, transparent 0 9%, rgba(255,255,255,.15) 9.4%, transparent 10%),
 linear-gradient(245deg, transparent 0 9%, rgba(255,255,255,.13) 9.4%, transparent 10%),
 radial-gradient(ellipse at 50% 98%, rgba(26,118,230,.55), transparent 42%);opacity:.8;}
.stadium{position:fixed;inset:0;pointer-events:none;z-index:-3;overflow:hidden}
.light{position:absolute;top:70px;width:260px;height:110px;background:repeating-radial-gradient(circle at 10px 10px,#fff 0 5px,transparent 6px 24px);filter:drop-shadow(0 0 16px #9bd7ff);opacity:.8;transform:rotate(16deg)}
.light.left{left:-40px}.light.right{right:-40px;transform:rotate(-16deg)}
.beam{position:absolute;top:90px;width:45vw;height:90vh;background:linear-gradient(90deg,transparent,rgba(98,183,255,.14),transparent);filter:blur(5px);transform-origin:top}
.beam.b1{left:4%;transform:rotate(-25deg)}.beam.b2{right:4%;transform:rotate(25deg)}
.spark{position:fixed;width:3px;height:22px;background:linear-gradient(#ffd15a,transparent);filter:drop-shadow(0 0 5px #ffb62a);animation:spark 6s linear infinite;opacity:.8}
@keyframes spark{from{transform:translateY(-15vh) rotate(25deg)}to{transform:translateY(120vh) translateX(-120px) rotate(25deg);opacity:0}}
.wrap{width:min(1200px,94vw);margin:0 auto;padding:28px 0 42px;text-align:center}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.btn{appearance:none;border:1px solid rgba(180,215,255,.45);background:rgba(2,8,20,.55);color:#fff;padding:12px 18px;border-radius:9px;text-transform:uppercase;letter-spacing:1.8px;font:700 15px Arial,sans-serif;cursor:pointer;box-shadow:inset 0 0 18px rgba(59,167,255,.12)}
.logoWrap{margin:-6px auto -2px;width:min(420px,72vw);position:relative}
.logoWrap:before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(54,173,255,.35),transparent 65%);filter:blur(28px);}
.logo{position:relative;width:100%;display:block;mix-blend-mode:screen;filter:drop-shadow(0 0 10px rgba(104,199,255,.8)) drop-shadow(0 12px 28px rgba(0,0,0,.8));}
.title{margin:0;text-transform:uppercase;font-size:clamp(44px,8vw,96px);line-height:.95;letter-spacing:2px;background:linear-gradient(#fff,#dce8f5 42%,#7e8ea3 58%,#fff);-webkit-background-clip:text;color:transparent;text-shadow:0 5px 0 rgba(0,0,0,.3),0 0 18px rgba(180,220,255,.28)}
.season{color:var(--blue2);font:900 clamp(22px,4vw,38px) Arial,sans-serif;letter-spacing:16px;text-transform:uppercase;text-shadow:0 0 18px rgba(40,168,255,.8);margin:12px 0 22px}
.countPanel{width:min(900px,100%);margin:0 auto;padding:22px;border:1px solid rgba(68,180,255,.75);border-radius:10px;background:linear-gradient(180deg,rgba(3,12,28,.88),rgba(3,12,28,.55));box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 34px rgba(27,145,255,.24)}
.kicker{font:900 18px Arial,sans-serif;letter-spacing:9px;text-transform:uppercase;margin-bottom:12px}
.countdown{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.timebox{min-width:145px}
.num{display:block;font-size:clamp(54px,9vw,105px);line-height:1;color:#8ec7ff;text-shadow:0 0 18px rgba(85,173,255,.85);letter-spacing:4px}
.label{font:900 15px Arial,sans-serif;letter-spacing:4px;color:#fff;text-transform:uppercase}
.meta{width:min(900px,100%);margin:18px auto 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(87,163,244,.35);border:1px solid rgba(105,181,255,.4);border-radius:10px;overflow:hidden}
.meta div{background:rgba(4,13,29,.72);padding:17px 10px;font:900 16px Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase}
.meta b{display:block;color:var(--blue2);font-size:28px;letter-spacing:2px}
.stage{margin:12px auto 22px;width:min(1040px,100%);min-height:310px;border:1px solid rgba(255,209,90,.8);border-radius:12px;background:linear-gradient(135deg,rgba(5,13,25,.92),rgba(5,13,25,.72));box-shadow:inset 0 0 50px rgba(255,209,90,.08),0 0 30px rgba(0,0,0,.55);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage:before{content:"";position:absolute;left:8%;right:8%;top:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 18px var(--gold)}
.stage:after{content:"THE PICK IS IN";position:absolute;top:26px;left:0;right:0;color:var(--gold);font:900 16px Arial,sans-serif;letter-spacing:10px;text-shadow:0 0 14px rgba(255,209,90,.6)}
.card{position:relative;width:min(760px,86%);padding:34px 24px 30px;border-radius:14px;border:2px solid rgba(255,209,90,.9);background:linear-gradient(135deg,rgba(7,22,47,.98),rgba(1,6,16,.98));box-shadow:0 0 28px rgba(255,209,90,.4), inset 0 0 45px rgba(40,168,255,.1);transform:translateY(28px) scale(.95);opacity:0;transition:.55s ease}
.card.show{opacity:1;transform:translateY(0) scale(1)}
.pick{font-size:clamp(48px,8vw,82px);letter-spacing:4px;line-height:1;color:white;text-shadow:0 0 10px #fff}
.name{font-size:clamp(34px,7vw,78px);line-height:1.06;margin-top:14px;color:var(--gold);text-shadow:0 0 22px rgba(255,209,90,.75);word-break:break-word}
.status{font:900 22px Arial,sans-serif;letter-spacing:3px;color:#fff;text-transform:uppercase;margin:6px 0 20px}
.start{display:none;margin:10px auto 0;background:linear-gradient(180deg,#ffd15a,#a97212);color:#07101d;border:0;font:900 24px Arial,sans-serif;padding:16px 34px;border-radius:10px;text-transform:uppercase;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(255,209,90,.55)}
.final{display:none;width:min(960px,100%);margin:20px auto;padding:20px;border:1px solid rgba(96,180,255,.55);border-radius:12px;background:rgba(3,12,28,.82)}
.final h2{margin:0 0 14px;font-size:42px;text-transform:uppercase;color:var(--blue2)}
table{width:100%;border-collapse:collapse;font:800 18px Arial,sans-serif;text-align:left}td,th{padding:10px;border-bottom:1px solid rgba(255,255,255,.12)}th{color:var(--gold);text-transform:uppercase}
.hash{margin-top:16px;padding:13px;border-radius:8px;background:#020815;border:1px solid rgba(255,255,255,.12);font:700 13px Consolas,monospace;color:#dceaff;word-break:break-all;text-align:left}
.footer{margin-top:22px;color:rgba(220,232,255,.55);font:900 15px Arial,sans-serif;letter-spacing:8px;text-transform:uppercase}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:20;animation:fall 4.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
@media(max-width:700px){.topbar{gap:8px}.btn{padding:10px 12px;font-size:12px}.season{letter-spacing:8px}.meta{grid-template-columns:1fr}.stage{min-height:260px}.stage:after{letter-spacing:5px}}
</style>
</head>
